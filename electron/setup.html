<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Lockdown Admin — Setup</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }
    .container { max-width: 560px; width: 100%; }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .subtitle {
      color: #94a3b8;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .config-box {
      padding: 1.5rem;
      background: #1e293b;
      border-radius: 12px;
      border: 2px solid #334155;
    }
    .config-box label {
      display: block;
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
    }
    .config-box input {
      width: 100%;
      padding: 0.625rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 0.875rem;
      font-family: monospace;
    }
    .config-box input:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .test-result {
      margin-top: 0.5rem;
      font-size: 0.8rem;
      min-height: 1.2em;
    }
    .test-result.ok { color: #22c55e; }
    .test-result.err { color: #ef4444; }
    .test-result.testing { color: #f59e0b; }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: background 0.2s;
    }
    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }
    .btn:not(:disabled) {
      background: #3b82f6;
      color: white;
    }
    .btn:not(:disabled):hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <h1>☁️ Remote Lockdown Admin</h1>
    <p class="subtitle">Enter the URL of your deployed Cloudflare Worker backend. This is where all API calls will be sent.</p>

    <div class="config-box">
      <label for="worker-url">Cloudflare Worker URL</label>
      <input type="text" id="worker-url" value="https://lockdown-serverless.mainacollins196.workers.dev" oninput="onUrlInput()">
      <div class="test-result" id="test-result"></div>
    </div>

    <button class="btn" id="confirm-btn" disabled onclick="confirm()">Connect</button>
  </div>

  <script>
    let workerUrlValid = false;

    function onUrlInput() {
      workerUrlValid = false;
      document.getElementById('test-result').textContent = '';
      document.getElementById('confirm-btn').disabled = true;
    }

    async function testWorkerUrl() {
      const url = document.getElementById('worker-url').value.trim();
      const resultEl = document.getElementById('test-result');

      if (!url) {
        resultEl.textContent = '';
        return;
      }

      resultEl.textContent = 'Testing connection...';
      resultEl.className = 'test-result testing';

      try {
        const result = await window.wizardAPI.testWorkerUrl(url);
        if (result.ok) {
          resultEl.textContent = '✓ Connected — serverless backend verified';
          resultEl.className = 'test-result ok';
          workerUrlValid = true;
        } else {
          resultEl.textContent = '✗ ' + result.error;
          resultEl.className = 'test-result err';
          workerUrlValid = false;
        }
      } catch (err) {
        resultEl.textContent = '✗ ' + err.message;
        resultEl.className = 'test-result err';
        workerUrlValid = false;
      }
      document.getElementById('confirm-btn').disabled = !workerUrlValid;
    }

    function confirm() {
      if (!workerUrlValid) return;
      const url = document.getElementById('worker-url').value.trim();
      // Normalize: ensure it ends with /api
      let normalized = url;
      if (!normalized.endsWith('/api')) {
        normalized = normalized.replace(/\/$/, '') + '/api';
      }
      window.wizardAPI.confirmUrl(normalized);
    }

    // Auto-test URL on load and when user stops typing (debounced)
    let urlTimer = null;
    document.getElementById('worker-url').addEventListener('input', () => {
      clearTimeout(urlTimer);
      urlTimer = setTimeout(testWorkerUrl, 600);
    });
    // Test the pre-filled URL on load
    setTimeout(testWorkerUrl, 300);
  </script>
</body>
</html>
