name = "lockdown-serverless"
main = "worker.ts"
compatibility_date = "2024-01-01"

# KV Namespace for device state
# Create with: wrangler kv:namespace create LOCKDOWN_KV
# Then paste the ID below
[[kv_namespaces]]
binding = "LOCKDOWN_KV"
id = "84b24c0c1b9e4896b6c6fa41548ac636"

# Secrets (set with: wrangler secret put ADMIN_TOKEN)
# [vars]
# ADMIN_TOKEN is set via `wrangler secret put ADMIN_TOKEN`
