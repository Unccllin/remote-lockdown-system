name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # ---------------------------------------------------------------------------
  # Run tests before releasing
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: cd server && npm ci && npm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: cd agent && pip install -r requirements.txt && pip install pytest && pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Build agent binaries on all 3 platforms and publish to GitHub Release.
  #
  # These binaries are separate from the Electron app. They allow the admin
  # app's installer endpoint to download cross-platform agent binaries on
  # demand (Solution A: Hybrid local + remote download).
  #
  # Asset naming convention:
  #   lockdown-agent-{platform}-{arch}{ext}
  #   lockdown-watchdog-{platform}-{arch}{ext}
  #   lockdown-recovery-{platform}-{arch}{ext}
  #
  # Plus a SHA256SUMS file for checksum verification.
  # ---------------------------------------------------------------------------
  publish-agent-binaries:
    name: Agent Binaries (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            platform: windows
            arch: x64
            ext: .exe
          - os: ubuntu-latest
            label: linux-x64
            platform: linux
            arch: x64
            ext: ""
          - os: macos-latest
            label: darwin-x64
            platform: darwin
            arch: x64
            ext: ""

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies + build agent binaries
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller
          python -m PyInstaller agent.spec --noconfirm
          python -m PyInstaller watchdog.spec --noconfirm
          python -m PyInstaller offline_recovery.spec --noconfirm

      - name: Stage binaries with platform-specific names
        shell: bash
        run: |
          mkdir -p staging
          for bin in lockdown-agent lockdown-watchdog lockdown-recovery; do
            src="dist/${bin}${{ matrix.ext }}"
            dst="staging/${bin}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.ext }}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Staged: $dst ($(du -h "$dst" | cut -f1))"
            else
              echo "WARNING: $src not found, skipping"
            fi
          done

      - name: Generate checksums
        shell: bash
        run: |
          cd staging
          sha256sum lockdown-* > SHA256SUMS-${{ matrix.label }}
          cat SHA256SUMS-${{ matrix.label }}

      - name: Upload binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: agent/staging/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Merge all platform checksums into a single SHA256SUMS file
  # ---------------------------------------------------------------------------
  publish-checksums:
    name: Publish Checksums
    needs: publish-agent-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download per-platform checksums
        run: |
          gh release download "${{ github.ref_name }}" \
            --pattern "SHA256SUMS-*" \
            --dir ./checksums \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge checksums
        run: |
          cat checksums/SHA256SUMS-* > SHA256SUMS
          echo "=== Merged SHA256SUMS ==="
          cat SHA256SUMS

      - name: Upload merged checksums
        uses: softprops/action-gh-release@v2
        with:
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Build + publish Electron app for Windows
  # ---------------------------------------------------------------------------
  release-windows:
    name: Release (Windows)
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      # Build dashboard (needed by Electron app)
      - run: cd ../dashboard && npm ci && npm run build

      # Build agent binaries (Windows)
      - run: cd ../agent && pip install -r requirements.txt pyinstaller && python -m PyInstaller agent.spec --noconfirm && python -m PyInstaller watchdog.spec --noconfirm && python -m PyInstaller offline_recovery.spec --noconfirm

      # Build + publish Electron app
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Azure Trusted Signing (uncomment when configured):
          # AZURE_TRUSTED_SIGNING_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          # AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          # AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}

  # ---------------------------------------------------------------------------
  # Build + publish Electron app for macOS
  # ---------------------------------------------------------------------------
  release-macos:
    name: Release (macOS)
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      - run: cd ../dashboard && npm ci && npm run build

      - run: cd ../agent && pip install -r requirements.txt pyinstaller && ./build.sh

      - run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer signing (uncomment when configured):
          # CSC_LINK: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          # CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  # ---------------------------------------------------------------------------
  # Build + publish Electron app for Linux
  # ---------------------------------------------------------------------------
  release-linux:
    name: Release (Linux)
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      - run: cd ../dashboard && npm ci && npm run build

      - run: cd ../agent && pip install -r requirements.txt pyinstaller && ./build.sh

      - run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
