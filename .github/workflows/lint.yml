name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel stale runs on the same branch when a new commit is pushed.
# Saves CI minutes and avoids confusing stale results.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ESLint — server (Node.js API)
  # ---------------------------------------------------------------------------
  lint-server:
    name: Lint Server (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        # ESLint + security plugin are now declared in devDependencies,
        # so npm ci installs them from the lockfile (no --no-save needed).
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ tests/ --max-warnings=0

  # ---------------------------------------------------------------------------
  # ESLint — dashboard (React + Vitest)
  # ---------------------------------------------------------------------------
  lint-dashboard:
    name: Lint Dashboard (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        # ESLint + React plugins are now declared in devDependencies,
        # so npm ci installs them from the lockfile (no --no-save needed).
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ tests/ --max-warnings=0

  # ---------------------------------------------------------------------------
  # ruff — agent (Python)
  # ---------------------------------------------------------------------------
  lint-agent:
    name: Lint Agent (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . tests/

      - name: Run ruff format check
        run: ruff format --check . tests/

  # ---------------------------------------------------------------------------
  # actionlint — GitHub Actions workflow validation
  # ---------------------------------------------------------------------------
  lint-workflows:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: v1.7.12
          fail-on-error: true
