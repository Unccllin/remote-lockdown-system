name: Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel stale runs on the same branch when a new commit is pushed.
# Saves CI minutes and avoids confusing stale results.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # ESLint — server (Node.js API)
  # ---------------------------------------------------------------------------
  lint-server:
    name: Lint Server (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        # ESLint + security plugin are now declared in devDependencies,
        # so npm ci installs them from the lockfile (no --no-save needed).
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ tests/ --max-warnings=0

  # ---------------------------------------------------------------------------
  # ESLint — dashboard (React + Vitest)
  # ---------------------------------------------------------------------------
  lint-dashboard:
    name: Lint Dashboard (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        # ESLint + React plugins are now declared in devDependencies,
        # so npm ci installs them from the lockfile (no --no-save needed).
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ tests/ --max-warnings=0

  # ---------------------------------------------------------------------------
  # ruff — agent (Python)
  # ---------------------------------------------------------------------------
  lint-agent:
    name: Lint Agent (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check . tests/

      - name: Run ruff format check
        run: ruff format --check . tests/

  # ---------------------------------------------------------------------------
  # actionlint — GitHub Actions workflow validation
  # ---------------------------------------------------------------------------
  lint-workflows:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: v1.7.12
          fail-on-error: true

  # ---------------------------------------------------------------------------
  # Worker type-check — the Worker had no tsconfig/Workers types until S141, so
  # `tsc --noEmit` had never run. First run found 18 real errors.
  # ---------------------------------------------------------------------------
  typecheck-worker:
    name: Type-check Worker (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: serverless

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: serverless/package-lock.json

      - run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # OpenAPI drift — every registered route must be documented
  # ---------------------------------------------------------------------------
  check-openapi:
    name: OpenAPI route coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Check every registered route is documented
        run: node scripts/check-openapi-routes.js

  # ---------------------------------------------------------------------------
  # Secret scan — the publish range, not the whole history
  #
  # scripts/prepush_secrets.py + pre-push-check.sh already gate a human's push
  # locally, but that gate only exists if the hook is installed — it was not,
  # so the S140 leak class (a credential committed, then re-quoted inside its
  # own log entry) had no automated defence. This job is the durable half.
  #
  # Scope is deliberately "exactly what this change publishes": the PR base, or
  # the previous tip on a branch push. A whole-history scan on a long history is
  # noisy enough to be read as a false alarm; run it on purpose with --all.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (publish range)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # Full history: the scan needs a real base commit to diff against.
          fetch-depth: 0

      - name: Scan the publish range for credential-shaped content
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin \
              "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            BASE="origin/${GITHUB_BASE_REF}"
          elif [ -n "${BEFORE:-}" ] \
            && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git rev-parse --verify -q "$BEFORE" >/dev/null; then
            BASE="$BEFORE"
          else
            # New branch, or the previous tip is unreachable. Scanning nothing
            # would report a false pass, so scan everything on purpose.
            echo "No usable base commit — scanning the full history."
            python3 scripts/prepush_secrets.py --all
            exit $?
          fi
          python3 scripts/prepush_secrets.py --base "$BASE" --head HEAD

  # ---------------------------------------------------------------------------
  # Static analysis (Semgrep) — the code scanning we can actually run
  # ---------------------------------------------------------------------------
  # CodeQL needs GitHub Code Security on a private repository (SARIF upload 403),
  # so codeql.yml is gated off. This covers the same ground without the licence:
  # Semgrep's default ruleset over JS/TS/Python/Dockerfile. It fails only on
  # ERROR-severity findings; WARNING/MEDIUM/INFO are summarised so the patterns
  # stay visible without blocking on day one.
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep (pinned)
        run: pip install semgrep==1.182.1

      # Semgrep exits non-zero when it finds anything; the gate below decides
      # what is blocking, so this step only records the report.
      - name: Scan
        run: semgrep scan --config=p/default --json-output=semgrep.json --quiet . || true

      - name: Gate on ERROR-severity findings
        run: python3 scripts/sast-gate.py semgrep.json
