name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly scan every Sunday at 00:00 UTC.
    - cron: '0 0 * * 0'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning on a PRIVATE repository requires GitHub Code Security
    # (formerly GitHub Advanced Security). Without it the SARIF upload returns
    #   403: GitHub Code Security or GitHub Advanced Security is not enabled
    # so this job failed on every push and showed as a permanently red workflow,
    # drowning real failures. It now skips (grey, not red) until the feature is
    # actually available: enable Code Security for the repository, then set the
    # repository variable CODE_SECURITY_ENABLED=true.
    # https://docs.github.com/en/code-security/reference/code-scanning/troubleshoot-analysis-errors/advanced-security-must-be-enabled
    if: vars.CODE_SECURITY_ENABLED == 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript, python
          # JavaScript/TypeScript analysis covers server/, dashboard/, electron/.
          # Python analysis covers agent/.
          config: |
            paths:
              - server/
              - dashboard/
              - electron/
              - agent/
            paths-ignore:
              - node_modules/

      - name: Autobuild
        uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
