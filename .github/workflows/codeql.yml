name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly scan every Sunday at 00:00 UTC.
    - cron: '0 0 * * 0'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Code scanning is free on PUBLIC repositories, so this runs normally now.
    # (While the repository was private it required GitHub Code Security; without
    # it the SARIF upload returned 403 and the job failed on every push, so it was
    # gated behind CODE_SECURITY_ENABLED. Keep the escape hatch for a future
    # private fork: set CODE_SECURITY_ENABLED=false to skip.)
    if: vars.CODE_SECURITY_ENABLED != 'false'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: javascript, python
          # JavaScript/TypeScript analysis covers server/, dashboard/, electron/.
          # Python analysis covers agent/.
          config: |
            paths:
              - server/
              - dashboard/
              - electron/
              - agent/
            paths-ignore:
              - node_modules/

      - name: Autobuild
        uses: github/codeql-action/autobuild@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
