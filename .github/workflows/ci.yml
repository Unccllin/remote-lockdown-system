name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs on the same ref when a new commit is pushed.
# Saves CI minutes and avoids confusing stale results (skill reasoning Q5).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Server tests (Node.js + Jest)
  # ---------------------------------------------------------------------------
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Security: fail the build on known high/critical vulnerabilities.
      # --audit-level=high means only high+critical findings exit non-zero;
      # moderate/low are reported but don't block.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      - run: npm test

  # ---------------------------------------------------------------------------
  # Dashboard tests (React + Vitest)
  # ---------------------------------------------------------------------------
  dashboard-tests:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      # Security: fail the build on known high/critical vulnerabilities.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      - run: npm test

  # ---------------------------------------------------------------------------
  # Agent tests (Python + pytest)
  # ---------------------------------------------------------------------------
  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: pip install pytest

      # Security: audit installed Python packages for known vulnerabilities.
      # pip-audit checks the active environment against the PyPI advisory DB.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict
        continue-on-error: false

      - run: pytest tests/ -v

  # ---------------------------------------------------------------------------
  # API E2E tests (Jest + Supertest, in-process Express + SQLite)
  # ---------------------------------------------------------------------------
  # Runs the API-level E2E suites (lockdown flow, recovery flow, and the
  # real-agent integration test) against an isolated SQLite temp database.
  # The agent-integration test spawns a Python subprocess, so Python deps
  # are installed too.
  api-e2e:
    name: API E2E (lockdown + recovery + agent)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # Server dependencies (jest, supertest, express, sqlite3, etc.)
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # Agent dependencies — the agent-integration E2E test spawns a real
      # Python agent subprocess that needs cryptography + requests.
      - name: Install agent dependencies
        run: pip install -r requirements.txt
        working-directory: agent

      - name: Run API E2E tests
        run: scripts/run-e2e.sh --agent-integration --verbose

  # ---------------------------------------------------------------------------
  # Dashboard E2E tests (Playwright + Chromium)
  # ---------------------------------------------------------------------------
  # Boots a real Express + SQLite backend (via e2e/fixtures.js) and the Vite
  # dev server (via playwright.config.js webServer), then runs the Playwright
  # E2E suite against headless Chromium. The fixtures import server modules
  # directly, so server/node_modules must be installed too.
  dashboard-e2e:
    name: Dashboard E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      # Dashboard dependencies (includes @playwright/test)
      - run: npm ci

      # Server dependencies — the E2E fixtures import server modules
      # (express, bcryptjs, etc.) via createRequire anchored to server/src/.
      - name: Install server dependencies
        run: npm ci
        working-directory: server

      # Install Playwright's Chromium browser binary + system dependencies.
      # --with-deps installs the OS libraries Chromium needs (libnss3, etc.).
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test
        env:
          # The fixtures set these defaults, but we pass them explicitly
          # to ensure the backend boots in SQLite test mode in CI.
          USE_SQLITE: 'true'
          ALLOW_NON_PROD: '1'

      # Upload the Playwright HTML report as a CI artifact on failure so
      # developers can download and inspect screenshots/traces.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 7
