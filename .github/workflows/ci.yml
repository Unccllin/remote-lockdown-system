name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Cancel in-progress runs on the same ref when a new commit is pushed.
# Saves CI minutes and avoids confusing stale results (skill reasoning Q5).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Server tests (Node.js + Jest)
  # ---------------------------------------------------------------------------
  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Security: fail the build on known high/critical vulnerabilities.
      # --audit-level=high means only high+critical findings exit non-zero;
      # moderate/low are reported but don't block.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      - run: npm test

  # ---------------------------------------------------------------------------
  # Dashboard tests (React + Vitest)
  # ---------------------------------------------------------------------------
  dashboard-tests:
    name: Dashboard Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci

      # Security: fail the build on known high/critical vulnerabilities.
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: false

      - run: npm test

  # ---------------------------------------------------------------------------
  # Agent tests (Python + pytest)
  # ---------------------------------------------------------------------------
  agent-tests:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: pip install pytest

      # Security: audit installed Python packages for known vulnerabilities.
      # pip-audit checks the active environment against the PyPI advisory DB.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict
        continue-on-error: false

      - run: pytest tests/ -v
