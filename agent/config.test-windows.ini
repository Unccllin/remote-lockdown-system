[agent]
# Point to the dev server running on 172.30.204.211
server_url = http://172.30.204.211:3001
agent_key = dev-agent-shared-key-not-a-placeholder-24
hostname = WIN-TEST-001
poll_interval = 10
lockdown_folder = C:\Users\Public\LockdownTest
lock_sentinel = C:\ProgramData\LockdownAgent\.locked
verify_tls = false

# Geolocation settings
google_api_key =
location_interval = 300

# Boot lockdown settings
# Set to false for initial testing — enable once you're confident
boot_lock_enabled = false
uefi_password =

# Key lifecycle & brick prevention
pending_ack_file = C:\ProgramData\LockdownAgent\.pending_ack
recovery_key_file = C:\ProgramData\LockdownAgent\.recovery_key
recovery_public_key = C:\ProgramData\LockdownAgent\recovery_master.pub
server_supports_ack_dedup = true
