[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --timeout=30"
# tests/conftest.py imports the top-level modules (`import agent`, ...), which
# only worked when the working directory was on sys.path. `python -m pytest`
# puts it there (that is what scripts/run-agent-tests.sh uses, and what every
# local command did); the bare `pytest` console script does not. CI runs the
# bare script, so collection died with "ModuleNotFoundError: No module named
# 'agent'" and exit code 4 — reported as "Agent Tests failure" for days with no
# visible reason. Declaring the rootdir as an import root makes collection
# independent of the invocation form.
pythonpath = ["."]
markers = [
    "hardware: tests that require real Windows/HP hardware",
    "slow: tests that take more than 5 seconds",
    "integration: tests that wire multiple modules together",
]

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    "boot_lockdown_test_runner.py",
    "hw_test_harness.py",
    "installer_gui.py",
    "*/__pycache__/*",
    "*/.venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
# Coverage gate (measured 2026-10-27: 61% statements, 3347/5465). Branch
# coverage is not measured. ~2 points of slack for ordinary refactoring.
# `--cov-fail-under` in the Makefile/CI uses the same number so pytest-cov and
# a bare `coverage report` agree; raise both together when coverage improves.
fail_under = 59
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if .*TYPE_CHECKING:",
]
