# ---------------------------------------------------------------------------
# VERIFICATION NODES
# ---------------------------------------------------------------------------
# These are the gates that must pass before any node can be marked complete.
# Each has a command and an expected result. The graph_assert engine runs
# these and checks the output.

verification_nodes:
  - id: V-SERVER
    name: server-jest
    command: "cd server && npm test"
    expected_exit: 0
    expected_output_contains: "passed"
    component: C-SERVER

  - id: V-AGENT
    name: agent-pytest
    command: "cd agent && python3 -m pytest tests/ -q"
    expected_exit: 0
    expected_output_contains: "passed"
    component: C-AGENT

  - id: V-DASHBOARD
    name: dashboard-vitest
    command: "cd dashboard && npx vitest run"
    expected_exit: 0
    expected_output_contains: "passed"
    component: C-DASHBOARD

  - id: V-LINT-SERVER
    name: server-eslint
    command: "cd server && npx eslint ."
    expected_exit: 0
    component: C-SERVER

  - id: V-LINT-DASHBOARD
    name: dashboard-eslint
    command: "cd dashboard && npx eslint ."
    expected_exit: 0
    component: C-DASHBOARD

  - id: V-LINT-AGENT
    name: agent-ruff
    command: "cd agent && python3 -m ruff check . && python3 -m ruff format \
             --check ."
    expected_exit: 0
    component: C-AGENT

  - id: V-BUILD-DASHBOARD
    name: dashboard-vite-build
    command: "cd dashboard && npx vite build"
    expected_exit: 0
    expected_output_contains: "built"
    component: C-DASHBOARD

  - id: V-SYNTAX-SWEEP
    name: js-syntax-sweep
    command: "find server/src electron -name '*.js' -o -name '*.cjs' | grep \
             -v node_modules | xargs -I{} node --check {}"
    expected_exit: 0
    component: C-SERVER

  - id: V-SHELL-SYNTAX
    name: shell-syntax-check
    command: "bash -n scripts/*.sh && bash -n \
             .devin/orchestration/orchestrator.sh"
    expected_exit: 0
    component: C-SERVER

  - id: V-ENV
    name: environment-verification
    command: "make verify-env"
    expected_exit: 0
    expected_output_contains: "PASS"
    component: C-SERVER

  - id: V-DOCKER
    name: docker-validation
    command: "scripts/validate-docker.sh"
    expected_exit: 0
    component: C-SERVER

  - id: V-ELECTRON-SYNTAX
    name: electron-syntax-check
    command: "cd electron && node --check main.js preload.js setup-preload.js \
             setup-wizard.js server-starter.js config.js updater.js"
    expected_exit: 0
    component: C-ELECTRON

  - id: V-HW-HARNESS
    name: hardware-test-harness
    command: "cd agent && python3 hw_test_harness.py --mode dry-run"
    expected_exit: 0
    expected_output_contains: "Summary"
    component: C-AGENT
    notes: >
      D-003 (CLOSED): Hardware-in-the-loop test harness v2.0. Dry-run mode
      (--mode dry-run) verifies the harness runs and generates an artifact.
      Check mode (--mode check) verifies environment without executing tests.
      Simulate mode (--mode simulate) executes real enforcement paths on
      Windows/HP hardware. On non-Windows, all tests are gracefully skipped.
      Use --upload <server-url> to POST artifacts to /api/hw-test-artifact.

# ---------------------------------------------------------------------------
# ENFORCEMENT PATH NODES
# ---------------------------------------------------------------------------
# These are the actual lockdown features — the core of the system.
# Each path has a status that tracks how verified it is:
#   verified-in-unit-test  — mocked tests pass
#   verified-in-sandbox    — E2E/sandbox tests pass (no real hardware)
#   verified-on-hardware   — run artifact from real machine (NOT YET ACHIEVED)
#   unverified             — no test coverage at all

enforcement_paths:
  - id: E-ENCRYPT
    name: file-encryption
    description: "Fernet encryption of LOCKDOWN_FOLDER"
    component: C-AGENT
    entry_function: "agent.encrypt_folder"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure.json"
    risk_notes: "D-011 CLOSED: Verified on Azure Windows 11 VM. 3 files \
                encrypted/decrypted in 33ms."

  - id: E-DECRYPT
    name: file-decryption
    description: "Fernet decryption of LOCKDOWN_FOLDER on recovery"
    component: C-AGENT
    entry_function: "agent.decrypt_folder"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_frankenstein_win2.json\
      #E-DECRYPT-01"
    risk_notes: >-
      Harness v2.0 simulate on FRANKENSTEIN (HP EliteBook 830 G8, Windows,
      admin, TPM present, BitLocker off), 2026-11-05; the artifact carries the
      environment and the agent binary hash.
      8/8 assertions: a wrong key leaves ciphertext and sentinel intact
      (InvalidToken handled, never a silent success); the right key decrypts
      every file, including a nested one. Residual risk: wrong-key handling.

  - id: E-LOCK-SCREEN
    name: workstation-lock
    description: "LockWorkStation (Windows) / dm-tool (Linux) / CGSession \
                 (macOS)"
    component: C-AGENT
    entry_function: "agent._lock_workstation"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure.json"
    risk_notes: "D-007 CLOSED: Verified on Azure Windows 11 VM. tsdiscon \
                issued with session_id=0, console_session_id=1."

  - id: E-GUARDIAN
    name: lock-guardian
    description: "Background thread re-asserting lock every 10s"
    component: C-AGENT
    entry_function: "agent.start_lock_guardian"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure.json"
    risk_notes: "D-007 CLOSED: Verified on Azure Windows 11 VM. Guardian ran \
                12s with re-lock."

  - id: E-BCD
    name: bcd-lockdown
    description: "bcdedit /set {default} to disable WinRE, boot menu, F8"
    component: C-AGENT
    entry_function: "bcd_lockdown.apply_bcd_lockdown"
    verified_by: [V-AGENT, V-HW-HARNESS]
    # Demoted 2026-10-27 from verified-on-hardware: every artifact cited for
    # this path records E-BCD-01 FAIL (Azure VM: platform restriction; the
    # live HP run of 2026-08-21: critical_applied=0, rolled_back=true). The
    # rollback and BitLocker suspend/resume do work, but "the enforcement path
    # was verified on hardware" is not what those artifacts show. I3 now
    # refuses the claim (see docs/D-129-HARDWARE-RUNBOOK.md §2, §6).
    status: verified-in-unit-test
    verification_ceiling: >-
      NOT hardware-verified by decision (S264). A failed run rewrites this
      machine's boot configuration and disables WinRE — the recovery path a
      boot failure would need — so verifying it requires a sacrificial unit
      plus a rescue USB, not another harness run.
    hardware_artifact_ref: "agent/hw_test_artifact_azure_bitlocker.json#E-BCD-0\
                           1"
    verification_note: "Attempted on hardware twice (Azure VM, HP SPARE_TEST \
                       2026-08-21); both recorded FAIL. Re-run \
                       agent/hw_test_harness.py --tag E-BCD --services admin \
                       on Windows and cite the passing artifact to restore \
                       this claim."
    risk_notes: "D-008 CLOSED: BitLocker suspend/resume verified on Azure VM \
                with BitLocker. BCD changes fail on Azure (platform \
                restriction) but rollback + BitLocker resume work correctly. \
                On HP SPARE_TEST the BCD apply reported critical_applied=0 \
                with rolled_back=true — the apply path, not just the \
                platform, is unproven."

  - id: E-HP-UEFI
    name: hp-uefi-lockdown
    description: "HP WMI SetBIOSSetting for USB boot, PXE, legacy, F12"
    component: C-AGENT
    entry_function: "hp_uefi_lockdown.apply_boot_lockdown"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-in-unit-test
    verification_ceiling: >-
      NOT hardware-verified by decision (S264). The test sets a FIRMWARE Setup
      Password that its rollback does not clear, so a failed or interrupted run
      needs HP service on this EliteBook — a vendor intervention, not a retry.
    risk_notes: "D-009 model-aware names; D-010 Sure Admin detection; needs \
                hardware verification."

  - id: E-ACK
    name: command-ack
    description: "ACK with key_material + bios_password + boot_lock_detail to \
                 server"
    component: C-AGENT
    entry_function: "agent.ack_command"
    verified_by: [V-AGENT, V-SERVER, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_frankenstein_win2.json\
      #E-ACK-01"
    risk_notes: >-
      Harness v2.0 simulate on FRANKENSTEIN (HP EliteBook 830 G8, Windows,
      admin, TPM present, BitLocker off), 2026-11-05; the artifact carries the
      environment and the agent binary hash.
      17/17 assertions: a refused connection preserves the pending ACK; the
      retry delivers it once with the SAME command_uuid and then deletes it;
      a 500 from the server keeps it for the next loop. Residual risk:
      extended-outage queue behaviour (see E-OFFLINE-QUEUE).

  - id: E-RECOVERY
    name: unlock-recovery
    description: "Server releases key, agent decrypts, removes sentinel"
    component: C-AGENT
    entry_function: "agent.handle_unlock"
    verified_by: [V-AGENT, V-SERVER, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_frankenstein_win2.json\
      #E-RECOVERY-01"
    risk_notes: >-
      Harness v2.0 simulate on FRANKENSTEIN (HP EliteBook 830 G8, Windows,
      admin, TPM present, BitLocker off), 2026-11-05; the artifact carries the
      environment and the agent binary hash.
      14/14 assertions: an unlock with no key material ACKs "failed" and
      releases nothing; the right key decrypts, removes the sentinel and
      deletes the recovery key file; the ACK records executed. Residual risk:
      key release security.

  - id: E-TRACK
    name: covert-tracking
    description: "Silent geolocation reporting (wifi scan + IP geo)"
    component: C-AGENT
    entry_function: "agent.handle_track"
    verified_by: [V-AGENT]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_frankenstein_win.json\
      #E-TRACK-01"
    risk_notes: >-
      Harness v2.0 simulate on FRANKENSTEIN (HP EliteBook 830 G8, Windows,
      admin, TPM present, BitLocker off), 2026-11-05; the artifact carries
      the environment and the agent binary hash.
      10/10 assertions, and the scope matters: location was reported through the
      IP fallback ("ip, ~citym"), not a netsh WiFi scan — so this evidences the
      reporting path INCLUDING the TLS-only IP fallback added in S252/S256, and
      NOT the platform WiFi-scan branch, which stays unit-tested only. Residual
      risk: geolocation API rate limits. Mutation
      audited (session 171, scripts/audit_test_teeth.py): the parser tests added
      in agent/tests/test_wifi_parsing.py are what fail when the scan returns
      nothing; before them every test patched scan_wifi_networks out, so a
      netsh/nmcli format change would have read as "no neighbours".
      IP fallback is TLS-only since S252: the default lookup was
      http://ip-api.com/json/ (cleartext, third party) and is now
      https://ipwho.is/, overridable with IP_GEOLOCATION_URL; a plain-HTTP
      override is refused unless TRACK_ALLOW_INSECURE_IP_LOOKUP=1

  - id: E-DEADMAN
    name: deadman-switch
    description: "Auto-lockdown if no server contact for 24h"
    component: C-AGENT
    entry_function: "agent.check_deadman"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_frankenstein_win2.json\
      #E-DEADMAN-01"
    risk_notes: >-
      Harness v2.0 simulate on FRANKENSTEIN (HP EliteBook 830 G8, Windows,
      admin, TPM present, BitLocker off), 2026-11-05; the artifact carries the
      environment and the agent binary hash.
      6/6 assertions: 60 s of skew does not fire; 25 h offline fires and
      encrypts; a backward clock jump is treated as stolen+expired; a corrupt
      deadman file is treated as tamper and fires. Residual risk: a false
      trigger on network outage, which the skew case exists to catch.

  - id: E-EFFECTIVENESS
    name: lockdown-effectiveness
    description: "boot_lock_detail + lockdown_effective reporting (Phase 17)"
    component: C-AGENT
    entry_function: "agent.handle_lockdown (boot_lock_detail aggregation)"
    verified_by: [V-AGENT, V-SERVER, V-DASHBOARD, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_frankenstein_win.json\
      #E-EFFECTIVENESS-01"
    risk_notes: >-
      Harness v2.0 simulate on FRANKENSTEIN (HP EliteBook 830 G8, Windows,
      admin, TPM present, BitLocker off), 2026-11-05; the artifact carries
      the environment and the agent binary hash.
      7/7 assertions: critical_applied=0 is reported as "partial" and never as a
      success claim. Closes the dangerous gap where critical_applied=0 was
      reported as success.

  - id: E-OFFLINE-QUEUE
    name: offline-queue
    description: "SQLite queue for location reports when offline"
