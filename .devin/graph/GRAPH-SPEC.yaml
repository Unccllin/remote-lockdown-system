  - id: D-134
    description: >-
      PBL's TPM NV indices were created under the platform hierarchy (the old
      PcdPblTpmUsePlatformHierarchy=TRUE default, TPM_RH_PLATFORM +
      PLATFORMCREATE), but stock firmware randomizes platformAuth or disables
      the hierarchy at EndOfDxe. The indices then became unreachable (NV_Read
      0x9A2, NV_DefineSpace 0x18B), DeviceId was never populated, and PBL
      silently followed the unprovisioned path. Fixed by the session-166 ruling:
      owner hierarchy, index-handle authorization, PCD default FALSE. The item
      stays open only for the real-hardware confirmation.
    close_criteria: >-
      The HP machine in the D-129 window boots the owner-hierarchy build and its
      serial log shows device_id from AK Name, with a TPM2_Clear afterwards
      treated as unenrolled rather than silently unlocking. QEMU cannot answer
      the firmware half, but the fixed build no longer depends on the target's
      platformAuth policy for reading, which is the point of the ruling.
    status: OPEN
    category: SECURITY
    commit_ref: >-
      613b11bb - PblTpmReadAkName authorizes NV_Read with the index handle;
      owner attributes are AUTHWRITE|AUTHREAD|NO_DA|OWNERREAD and
      PcdPblTpmUsePlatformHierarchy defaults to FALSE; provisioning scripts
      (provision-qemu-tpm.sh, ci-harness-docker.sh) create the AK Name index in
      the owner hierarchy so enrolment and firmware agree
    artifact_ref: >-
      firmware/PblPkg/artifacts/d134-owner-hierarchy-results.txt - three arms
      (owner+stock, owner+PBL, platform+stock) all read the AK Name on PblApp
      613b11bb; d134-nv-auth-matrix-results.txt - the TPM's authorization rules;
      d130-tpm-hierarchy-results.txt - the pre-fix failure (0x9A2) it replaces

  - id: D-135
    description: >-
      The lock-epoch counter at NV 0x1C00004 never incremented: every boot
      printed NV_Increment RC=0x9A2 even though the index was defined and
      provisioning reported OK, so NG-T7's rollback comparison could never fire.
      Root cause was three instances of a locally assumed value not matching
      what was provisioned (a 3-slot name cache for 4 indices, a refresh list
      naming 3 of 4, and an RS_PW fallback sending an empty password against a
      non-empty index auth).
    close_criteria: >-
      A boot where the epoch counter increments (read-back advances across
      boots) and NG-T7's rollback comparison is shown to fire on a deliberately
      rolled-back lock state.
    status: CLOSED
    category: SECURITY
    commit_ref: >-
      e14bcd0 - cache sized from PBL_NV_INDEX_COUNT with a STATIC_ASSERT;
      399dc8d - refresh every index from NV_ReadPublic, ask the TPM for an
      uncached NV name, and send the NV index auth in the RS_PW fallback;
      1d5a23f - D-136's CFB fix, without which the cached epoch was garbage
    artifact_ref: >-
      firmware/PblPkg/artifacts/d135-epoch-results.txt - five checks green,
      counter 1 -> 2 -> 4 (out-of-band) -> 5 across three boots, and
      "lock-state epoch stale (cache=2 live=4) - rolled back?" on the third;
      d135-boot-{1,2,3}-serial.log, d135-nv-name-vs-tpm.txt

  - id: D-136
    description: >-
      PblAesCfb256Process ran in place for both directions and always took its
      CFB feedback from the output buffer. On decrypt the XOR overwrites the
      ciphertext with plaintext before it becomes the next feedback block, so
      only block 0 decrypted correctly: any parameter-encrypted response
      longer than 16 bytes was corrupt from byte 16 on (DeviceId and Epoch of
      the lock-state cache).
    close_criteria: >-
      An encrypted NV read whose fields past byte 16 decode correctly, shown
      by the lock-state epoch comparing equal to the live counter on a fresh
      boot and stale on a rolled-back one.
    status: CLOSED
    category: SECURITY
    commit_ref: >-
      1d5a23f - Decrypt flag; feedback from the input block when decrypting,
      from the output block when encrypting
    artifact_ref: >-
      firmware/PblPkg/artifacts/d135-epoch-results.txt - NG-T7 diagnostics show
      cache epoch=1 live=1 (fresh) then cache epoch=2 live=4 (stale) instead
      of the garbage 18020293802152137203 seen before the fix

