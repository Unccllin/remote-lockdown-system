# ---------------------------------------------------------------------------
# GRAPH INVARIANTS (asserted by graph_assert.py)
# ---------------------------------------------------------------------------
#
# These are the rules the graph enforces. Violations raise GraphViolationError.
#
# I1: No phase can run before its dependencies are COMPLETE.
# I2: No debt item can be CLOSED without a commit_ref and artifact_ref.
# I3: No enforcement path can be marked "verified-on-hardware" without a
#     run artifact from real hardware (not WSL, not mock).
# I4: No session can close without updating trace.md with the session-end
#     status block.
# I5: No code changes can be made before RULE-ZERO is complete for the
#     current work item.
# I6: The orchestrator must know about ALL phases in the graph (resolved —
#     D-001 CLOSED; orchestrator.sh has all 17 phases in PHASE_DEPS, PHASE_NAMES,
#     show_status, run_all, and case statement).
# I7: Every phase marked COMPLETE must have a non-empty artifact reference
#     (resolved — D-002 CLOSED; all 17 .complete files populated with commit
#     hash + artifact + date + tests).

invariants:
  - id: I1
    rule: "phase_deps_must_be_complete"
    description: "No phase can run before its dependencies are COMPLETE"
    check: "for each phase P with deps D, all D must have status COMPLETE before P runs"

  - id: I2
    rule: "debt_close_requires_evidence"
    description: "No debt item can be CLOSED without commit_ref and artifact_ref"
    check: "for each debt item with status CLOSED, commit_ref and artifact_ref must be non-empty"

  - id: I3
    rule: "hardware_verification_requires_real_artifact"
    description: "No enforcement path can be marked verified-on-hardware without real hardware artifact"
    check: "for each enforcement path with status verified-on-hardware, artifact_ref must reference real hardware (not WSL, not mock)"

  - id: I4
    rule: "session_close_requires_trace_update"
    description: "No session can close without updating trace.md"
    check: "trace.md must have a new entry with session-end status block after CLOSE-DEBT"

  - id: I5
    rule: "rule_zero_before_code"
    description: "No code changes before RULE-ZERO is complete"
    check: "RULE-ZERO exit_conditions must be met before IMPLEMENT entry_conditions are checked"

  - id: I6
    rule: "orchestrator_knows_all_phases"
    description: "Orchestrator must know about ALL phases in the graph"
    check: "orchestrator.sh PHASE_DEPS and PHASE_NAMES must include all 17 phases (0-16)"
    currently_violated: false

  - id: I7
    rule: "complete_phases_have_artifacts"
    description: "Every phase marked COMPLETE must have a non-empty artifact reference"
    check: "each results/phase-N.complete file must contain commit hash + artifact reference"
    currently_violated: false
