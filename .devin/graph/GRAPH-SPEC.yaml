# ---------------------------------------------------------------------------
# VERIFICATION NODES
# ---------------------------------------------------------------------------
# These are the gates that must pass before any node can be marked complete.
# Each has a command and an expected result. The graph_assert engine runs
# these and checks the output.

verification_nodes:
  - id: V-SERVER
    name: server-jest
    command: "cd server && npm test"
    expected_exit: 0
    expected_output_contains: "passed"
    component: C-SERVER

  - id: V-AGENT
    name: agent-pytest
    command: "cd agent && python3 -m pytest tests/ -q"
    expected_exit: 0
    expected_output_contains: "passed"
    component: C-AGENT

  - id: V-DASHBOARD
    name: dashboard-vitest
    command: "cd dashboard && npx vitest run"
    expected_exit: 0
    expected_output_contains: "passed"
    component: C-DASHBOARD

  - id: V-LINT-SERVER
    name: server-eslint
    command: "cd server && npx eslint ."
    expected_exit: 0
    component: C-SERVER

  - id: V-LINT-DASHBOARD
    name: dashboard-eslint
    command: "cd dashboard && npx eslint ."
    expected_exit: 0
    component: C-DASHBOARD

  - id: V-LINT-AGENT
    name: agent-ruff
    command: "cd agent && python3 -m ruff check . && python3 -m ruff format --check ."
    expected_exit: 0
    component: C-AGENT

  - id: V-BUILD-DASHBOARD
    name: dashboard-vite-build
    command: "cd dashboard && npx vite build"
    expected_exit: 0
    expected_output_contains: "built"
    component: C-DASHBOARD

  - id: V-SYNTAX-SWEEP
    name: js-syntax-sweep
    command: "find server/src electron -name '*.js' -o -name '*.cjs' | grep -v node_modules | xargs -I{} node --check {}"
    expected_exit: 0
    component: C-SERVER

  - id: V-SHELL-SYNTAX
    name: shell-syntax-check
    command: "bash -n scripts/*.sh && bash -n .devin/orchestration/orchestrator.sh"
    expected_exit: 0
    component: C-SERVER

  - id: V-ENV
    name: environment-verification
    command: "make verify-env"
    expected_exit: 0
    expected_output_contains: "PASS"
    component: C-SERVER

  - id: V-DOCKER
    name: docker-validation
    command: "scripts/validate-docker.sh"
    expected_exit: 0
    component: C-SERVER

  - id: V-ELECTRON-SYNTAX
    name: electron-syntax-check
    command: "cd electron && node --check main.js preload.js setup-preload.js setup-wizard.js server-starter.js config.js updater.js"
    expected_exit: 0
    component: C-ELECTRON

  - id: V-HW-HARNESS
    name: hardware-test-harness
    command: "cd agent && python3 hw_test_harness.py --mode dry-run"
    expected_exit: 0
    expected_output_contains: "Summary"
    component: C-AGENT
    notes: >
      D-003 (CLOSED): Hardware-in-the-loop test harness v2.0. Dry-run mode
      (--mode dry-run) verifies the harness runs and generates an artifact.
      Check mode (--mode check) verifies environment without executing tests.
      Simulate mode (--mode simulate) executes real enforcement paths on
      Windows/HP hardware. On non-Windows, all tests are gracefully skipped.
      Use --upload <server-url> to POST artifacts to /api/hw-test-artifact.

# ---------------------------------------------------------------------------
# ENFORCEMENT PATH NODES
# ---------------------------------------------------------------------------
# These are the actual lockdown features — the core of the system.
# Each path has a status that tracks how verified it is:
#   verified-in-unit-test  — mocked tests pass
#   verified-in-sandbox    — E2E/sandbox tests pass (no real hardware)
#   verified-on-hardware   — run artifact from real machine (NOT YET ACHIEVED)
#   unverified             — no test coverage at all

enforcement_paths:
  - id: E-ENCRYPT
    name: file-encryption
    description: "Fernet encryption of LOCKDOWN_FOLDER"
    component: C-AGENT
    entry_function: "agent.encrypt_folder"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure.json"
    risk_notes: "D-011 CLOSED: Verified on Azure Windows 11 VM. 3 files encrypted/decrypted in 33ms."

  - id: E-DECRYPT
    name: file-decryption
    description: "Fernet decryption of LOCKDOWN_FOLDER on recovery"
    component: C-AGENT
    entry_function: "agent.decrypt_folder"
    verified_by: [V-AGENT]
    status: verified-in-unit-test
    risk_notes: "Wrong-key handling (InvalidToken)"

  - id: E-LOCK-SCREEN
    name: workstation-lock
    description: "LockWorkStation (Windows) / dm-tool (Linux) / CGSession (macOS)"
    component: C-AGENT
    entry_function: "agent._lock_workstation"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure.json"
    risk_notes: "D-007 CLOSED: Verified on Azure Windows 11 VM. tsdiscon issued with session_id=0, console_session_id=1."

  - id: E-GUARDIAN
    name: lock-guardian
    description: "Background thread re-asserting lock every 10s"
    component: C-AGENT
    entry_function: "agent.start_lock_guardian"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure.json"
    risk_notes: "D-007 CLOSED: Verified on Azure Windows 11 VM. Guardian ran 12s with re-lock."

  - id: E-BCD
    name: bcd-lockdown
    description: "bcdedit /set {default} to disable WinRE, boot menu, F8"
    component: C-AGENT
    entry_function: "bcd_lockdown.apply_bcd_lockdown"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-on-hardware
    hardware_artifact_ref: "agent/hw_test_artifact_azure_bitlocker.json"
    risk_notes: "D-008 CLOSED: BitLocker suspend/resume verified on Azure VM with BitLocker. BCD changes fail on Azure (platform restriction) but rollback + BitLocker resume work correctly."

  - id: E-HP-UEFI
    name: hp-uefi-lockdown
    description: "HP WMI SetBIOSSetting for USB boot, PXE, legacy, F12"
    component: C-AGENT
    entry_function: "hp_uefi_lockdown.apply_boot_lockdown"
    verified_by: [V-AGENT, V-HW-HARNESS]
    status: verified-in-unit-test
    risk_notes: "D-009 model-aware names; D-010 Sure Admin detection; needs hardware verification."

  - id: E-ACK
    name: command-ack
    description: "ACK with key_material + bios_password + boot_lock_detail to server"
    component: C-AGENT
    entry_function: "agent.ack_command"
    verified_by: [V-AGENT, V-SERVER]
    status: verified-in-unit-test
    risk_notes: "Network failure retries via pending ACK file"

  - id: E-RECOVERY
    name: unlock-recovery
    description: "Server releases key, agent decrypts, removes sentinel"
    component: C-AGENT
    entry_function: "agent.handle_unlock"
    verified_by: [V-AGENT, V-SERVER]
    status: verified-in-unit-test
    risk_notes: "Key release security; sentinel cleanup"

  - id: E-TRACK
    name: covert-tracking
    description: "Silent geolocation reporting (wifi scan + IP geo)"
    component: C-AGENT
    entry_function: "agent.handle_track"
    verified_by: [V-AGENT]
    status: verified-in-unit-test
    risk_notes: "Platform-specific wifi scanning; geolocation API rate limits"

  - id: E-DEADMAN
    name: deadman-switch
    description: "Auto-lockdown if no server contact for 24h"
    component: C-AGENT
    entry_function: "agent.check_deadman"
    verified_by: [V-AGENT]
    status: verified-in-unit-test
    risk_notes: "Clock skew; false trigger on network outage"

  - id: E-EFFECTIVENESS
    name: lockdown-effectiveness
    description: "boot_lock_detail + lockdown_effective reporting (Phase 17)"
    component: C-AGENT
    entry_function: "agent.handle_lockdown (boot_lock_detail aggregation)"
    verified_by: [V-AGENT, V-SERVER, V-DASHBOARD]
    status: verified-in-unit-test
    risk_notes: "Closes the dangerous gap where critical_applied=0 was reported as success"

  - id: E-OFFLINE-QUEUE
    name: offline-queue
    description: "SQLite queue for location reports when offline"
    component: C-AGENT
    entry_function: "agent.queue_offline / agent.drain_offline_queue"
    verified_by: [V-AGENT]
    status: verified-in-unit-test
    risk_notes: "Queue growth on extended offline; SQLite corruption"

  - id: E-AUTO-UPDATE
    name: agent-auto-update
    description: "Download + verify + apply signed agent updates"
    component: C-AGENT
    entry_function: "agent.check_for_update / agent.download_update"
    verified_by: [V-AGENT]
    status: verified-in-unit-test
    risk_notes: "Update server availability; signature verification on Windows"

# ---------------------------------------------------------------------------
# COMPONENT NODES
# ---------------------------------------------------------------------------
# The buildable components. Each has a build command and a set of
# verification nodes that must pass.

component_nodes:
  - id: C-SERVER
    name: server
    path: server/
    build_command: "cd server && npm install"
    verify_nodes: [V-SERVER, V-LINT-SERVER, V-SYNTAX-SWEEP]

  - id: C-DASHBOARD
    name: dashboard
    path: dashboard/
    build_command: "cd dashboard && npm install"
    verify_nodes: [V-DASHBOARD, V-LINT-DASHBOARD, V-BUILD-DASHBOARD]

  - id: C-AGENT
    name: agent
    path: agent/
    build_command: "cd agent && python3 -m pip install -r requirements.txt"
    verify_nodes: [V-AGENT, V-LINT-AGENT]

  - id: C-ELECTRON
    name: electron
    path: electron/
    build_command: "cd electron && npm install"
    verify_nodes: [V-ELECTRON-SYNTAX]

# ---------------------------------------------------------------------------
# DEBT ITEMS
# ---------------------------------------------------------------------------
# Tracked in two ledgers:
#   - docs/adr/DEBT-LEDGER.md       — D-001..D-021 (legacy, all CLOSED)
#   - docs/adr/PBL-DEBT-LEDGER.md   — D-100..D-130 (PBL, 31 OPEN)
# Each debt item has:
#   - id, description, close_criteria, status, commit_ref, artifact_ref
# The graph asserts that a debt item cannot be CLOSED without:
#   1. A run artifact (EVIDENCE node output)
#   2. A commit hash
#   3. The relevant ledger (DEBT-LEDGER.md or PBL-DEBT-LEDGER.md) updated

