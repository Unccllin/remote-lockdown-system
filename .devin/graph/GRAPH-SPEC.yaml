# ---------------------------------------------------------------------------
# COMPONENT NODES
# ---------------------------------------------------------------------------
# The buildable components. Each has a build command and a set of
# verification nodes that must pass.

component_nodes:
  - id: C-SERVER
    name: server
    path: server/
    build_command: "cd server && npm install"
    verify_nodes: [V-SERVER, V-LINT-SERVER, V-SYNTAX-SWEEP]

  - id: C-DASHBOARD
    name: dashboard
    path: dashboard/
    build_command: "cd dashboard && npm install"
    verify_nodes: [V-DASHBOARD, V-LINT-DASHBOARD, V-BUILD-DASHBOARD]

  - id: C-AGENT
    name: agent
    path: agent/
    build_command: "cd agent && python3 -m pip install -r requirements.txt"
    verify_nodes: [V-AGENT, V-LINT-AGENT]

  - id: C-ELECTRON
    name: electron
    path: electron/
    build_command: "cd electron && npm install"
    verify_nodes: [V-ELECTRON-SYNTAX]

