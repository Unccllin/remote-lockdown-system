# GRAPH-SPEC.yaml — The Node Graph for Remote Lockdown System
#
# This is the center and heart of the project. Every agent session, every
# phase, every verification, and every enforcement path flows through this
# graph. The graph defines:
#   - What nodes exist (the work to be done and the gates that guard it)
#   - What edges are allowed (which nodes can transition to which)
#   - What conditions must be met to traverse an edge
#   - What verification gates must pass before a node is "closed"
#
# The graph is enforced by graph_assert.py. Violations raise
# GraphViolationError and halt the pipeline. No node can be skipped.
#
# Inspired by the ICT trading bot orchestration pattern: multi-session
# context persistence, Rule Zero (read before code), run artifacts as
# gates, and structured session-end handoff.

# ---------------------------------------------------------------------------
# NODE TYPES
# ---------------------------------------------------------------------------
#
# SESSION  — lifecycle nodes that frame each agent session
# GATE     — mandatory checkpoints that must pass before proceeding
# PHASE    — production-readiness phases (P0-P16), each with a skill file
# VERIFY   — verification nodes (tests, lint, build, env checks)
# ENFORCE  — enforcement path nodes (the actual lockdown features)
# COMPONENT — buildable components (server, dashboard, agent, electron)
# DEBT     — debt items tracked in DEBT-LEDGER.md
# EVIDENCE — run artifacts that prove a node actually executed

# ---------------------------------------------------------------------------
# SESSION LIFECYCLE NODES
# ---------------------------------------------------------------------------
# These nodes frame every agent session. They are the entry and exit points.
# No work happens outside this lifecycle.

session_nodes:
  - id: SESSION-START
    type: SESSION
    description: >
      Session begins. Agent reads trace.md, DEBT-LEDGER.md, and GRAPH-SPEC.yaml.
      Identifies the next open debt item or next phase to work on.
      Sets the session objective.
    entry_conditions: []
    exit_conditions:
      - "trace.md read and understood"
      - "DEBT-LEDGER.md read — open items identified"
      - "GRAPH-SPEC.yaml read — current node located"
      - "session objective stated in one sentence"

  - id: RULE-ZERO
    type: GATE
    description: >
      Read before you code. For the current work item, read the relevant
      skill file(s), the source code that will be changed, and any ADRs.
      Log understanding to trace.md before touching any file.
      This is NOT optional. Code written before Rule Zero is complete
      will be wrong in ways that are hard to find later.
    entry_conditions:
      - "SESSION-START complete"
    exit_conditions:
      - "relevant skill file(s) read"
      - "source code to be changed read"
      - "understanding logged to trace.md"
      - "implementation gaps identified (if any)"

  - id: IMPLEMENT
    type: SESSION
    description: >
      Write code changes. Only after RULE-ZERO is complete.
      Follow existing conventions (AGENTS.md). Do not duplicate detection
      logic — only port entry/execution wiring.
    entry_conditions:
      - "RULE-ZERO complete"
    exit_conditions:
      - "code changes written"
      - "diff visible (every line accountable)"

  - id: VERIFY
    type: SESSION
    description: >
      Run the verification suite. This is not optional — a passing sandbox
      test is NOT a close. A description of what the code does is NOT a close.
      A printed log from actual execution is a close.
    entry_conditions:
      - "IMPLEMENT complete"
    exit_conditions:
      - "relevant VERIFY nodes pass"
      - "lint clean"
      - "build succeeds (if applicable)"

  - id: ARTIFACT
    type: EVIDENCE
    description: >
      Capture a run artifact — actual printed output from live execution
      proving the code works. For verification nodes, this is the test
      output. For enforcement paths, this is the decision chain log.
      "No setup detected" with condition values printed IS an artifact.
      A timeout with no output is NOT.
    entry_conditions:
      - "VERIFY complete"
    exit_conditions:
      - "run artifact captured and referenced in trace.md"

  - id: CLOSE-DEBT
    type: SESSION
    description: >
      Update DEBT-LEDGER.md (OPEN -> CLOSED with commit hash + artifact ref).
      Update trace.md with session-end status block. This is the only node
      that can mark a debt item as closed.
    entry_conditions:
      - "ARTIFACT complete"
    exit_conditions:
      - "DEBT-LEDGER.md updated (if a debt item was closed)"
      - "trace.md updated with session-end status block"
      - "next session opening stated in one sentence"

# ---------------------------------------------------------------------------
# SESSION LIFECYCLE EDGES
# ---------------------------------------------------------------------------
# The only allowed path through a session. No shortcuts.

session_edges:
  - from: SESSION-START
    to: RULE-ZERO
    condition: "session objective identified"
  - from: RULE-ZERO
    to: IMPLEMENT
    condition: "understanding logged to trace.md"
  - from: IMPLEMENT
    to: VERIFY
    condition: "code changes written"
  - from: VERIFY
    to: ARTIFACT
    condition: "verification nodes pass"
  - from: ARTIFACT
    to: CLOSE-DEBT
    condition: "run artifact captured"
  - from: CLOSE-DEBT
    to: SESSION-START
    condition: "next session opens (cross-session cycle)"
    cross_session: true

