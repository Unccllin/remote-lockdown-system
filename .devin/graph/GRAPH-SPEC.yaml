  - id: D-132
    description: >-
      The C4-pinned CA never reaches the TLS layer: PblTlsVerifyCert has no
      caller, and EDK2's EFI_HTTP_PROTOCOL hard-codes EFI_TLS_VERIFY_PEER
      against a platform TlsCaCertificate store PBL never populates (and cannot
      populate from a SHA-256 pin). The HTTPS verdict fetch therefore resets the
      connection after TCP is established.
