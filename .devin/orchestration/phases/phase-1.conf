# Phase 1: Secrets & Configuration Management
PHASE=1
NAME="secrets-config"
SKILL_DOMAIN=".devin/skills/phase-1-secrets-config/SKILL.md"
FILES_OWNED="scripts/generate-secrets.sh,scripts/generate-recovery-keys.sh,scripts/validate-env.sh"
TASKS="create-secrets-generator,create-recovery-key-generator,create-env-validator"
GRAPH_NODE="P1"
VERIFY_NODES="V-SHELL-SYNTAX V-ENV"

phase_tests() {
  # Test: all scripts exist and are executable
  for script in generate-secrets.sh generate-recovery-keys.sh validate-env.sh; do
    [[ -x "$PROJECT_ROOT/scripts/$script" ]] || { fail "$script not executable"; return 1; }
  done

  # Test: generate-secrets.sh produces valid output in dry-run mode
  local tmpdir
  tmpdir=$(mktemp -d)
  "$PROJECT_ROOT/scripts/generate-secrets.sh" --output "$tmpdir" --dry-run >/dev/null 2>&1 || { fail "generate-secrets.sh dry-run failed"; rm -rf "$tmpdir"; return 1; }

  # Test: generated secrets have correct format (64 hex chars = 32 bytes)
  if [[ -f "$tmpdir/jwt_secret.txt" ]]; then
    local secret
    secret=$(cat "$tmpdir/jwt_secret.txt")
    [[ ${#secret} -eq 64 ]] || { fail "JWT secret wrong length"; rm -rf "$tmpdir"; return 1; }
    [[ "$secret" =~ ^[0-9a-f]+$ ]] || { fail "JWT secret not hex"; rm -rf "$tmpdir"; return 1; }
  fi
  rm -rf "$tmpdir"

  # Test: validate-env.sh catches missing required vars
  "$PROJECT_ROOT/scripts/validate-env.sh" --check-required 2>&1 | grep -q "JWT_SECRET" || true

  return 0
}
