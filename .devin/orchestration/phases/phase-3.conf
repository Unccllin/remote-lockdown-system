# Phase 3: Code Hardening & Security Review
PHASE=3
NAME="hardening"
SKILL_DOMAIN=".devin/skills/phase-3-hardening/SKILL.md"
FILES_OWNED="server/src/routes/agent.js,server/src/routes/devices.js,server/src/middleware/hmacAuth.js,agent/agent.py,server/tests/security.test.js,agent/tests/test_hardening.py"
TASKS="audit-server-error-handling,audit-agent-error-handling,add-input-validation-tests,review-crypto-edge-cases,add-security-tests"
GRAPH_NODE="P3"
VERIFY_NODES="V-SERVER V-AGENT"

phase_tests() {
  # Test: security test files exist
  [[ -f "$PROJECT_ROOT/server/tests/security.test.js" ]] || { fail "Server security tests missing"; return 1; }
  [[ -f "$PROJECT_ROOT/agent/tests/test_hardening.py" ]] || { fail "Agent hardening tests missing"; return 1; }

  # Test: server security tests pass
  (cd "$PROJECT_ROOT/server" && npm test -- --testPathPattern="security" >/dev/null 2>&1) || {
    fail "Server security tests failed"
    return 1
  }

  # Test: agent hardening tests pass
  (cd "$PROJECT_ROOT/agent" && python -m pytest tests/test_hardening.py -v >/dev/null 2>&1) || {
    fail "Agent hardening tests failed"
    return 1
  }

  return 0
}
