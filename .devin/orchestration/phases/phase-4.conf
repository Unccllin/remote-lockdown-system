# Phase 4: CI/CD Pipeline Enhancement
PHASE=4
NAME="cicd"
SKILL_DOMAIN=".devin/skills/phase-4-cicd/SKILL.md"
FILES_OWNED=".github/workflows/ci.yml,.github/workflows/release.yml,.github/dependabot.yml,.github/workflows/lint.yml"
TASKS="add-linting-workflow,add-dependabot-config,enhance-ci-caching,add-security-scanning"
GRAPH_NODE="P4"
VERIFY_NODES="V-SYNTAX-SWEEP"

phase_tests() {
  # Test: dependabot config exists
  [[ -f "$PROJECT_ROOT/.github/dependabot.yml" ]] || { fail "dependabot.yml missing"; return 1; }

  # Test: lint workflow exists
  [[ -f "$PROJECT_ROOT/.github/workflows/lint.yml" ]] || { fail "lint workflow missing"; return 1; }

  # Test: all workflow YAML files are valid
  for wf in "$PROJECT_ROOT"/.github/workflows/*.yml; do
    python3 -c "import yaml; yaml.safe_load(open('$wf'))" 2>&1 || { fail "Invalid YAML: $wf"; return 1; }
  done

  # Test: CI workflow has security scanning step
  grep -qi "security\|trivy\|snyk\|npm.audit\|pip-audit" "$PROJECT_ROOT/.github/workflows/ci.yml" || {
    fail "No security scanning in CI"
    return 1
  }

  return 0
}
