# Phase 7: E2E Testing & Verification Automation
PHASE=7
NAME="e2e-testing"
SKILL_DOMAIN=".devin/skills/phase-7-e2e-testing/SKILL.md"
FILES_OWNED="tests/e2e/lockdown-flow.test.js,tests/e2e/recovery-flow.test.js,tests/e2e/setup.js,scripts/run-e2e.sh,docs/E2E_TEST.md"
TASKS="create-e2e-lockdown-test,create-e2e-recovery-test,create-e2e-runner-script,update-e2e-docs"
GRAPH_NODE="P7"
VERIFY_NODES="V-SERVER V-AGENT"

phase_tests() {
  # Test: E2E test files exist
  [[ -f "$PROJECT_ROOT/tests/e2e/lockdown-flow.test.js" ]] || { fail "lockdown E2E test missing"; return 1; }
  [[ -f "$PROJECT_ROOT/tests/e2e/recovery-flow.test.js" ]] || { fail "recovery E2E test missing"; return 1; }

  # Test: E2E runner script exists and is executable
  [[ -x "$PROJECT_ROOT/scripts/run-e2e.sh" ]] || { fail "run-e2e.sh not executable"; return 1; }

  # Test: E2E test files are valid JavaScript
  node -c "$PROJECT_ROOT/tests/e2e/lockdown-flow.test.js" 2>&1 || { fail "lockdown E2E test syntax error"; return 1; }
  node -c "$PROJECT_ROOT/tests/e2e/recovery-flow.test.js" 2>&1 || { fail "recovery E2E test syntax error"; return 1; }

  return 0
}
