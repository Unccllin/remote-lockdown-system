phase_tests() {
  [[ -f "$PROJECT_ROOT/server/src/db/migrations/007_rbac.sql" ]] || { fail "PG migration missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/src/db/migrations-sqlite/007_rbac.sql" ]] || { fail "SQLite migration missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/src/routes/admins.js" ]] || { fail "admins route missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/tests/admins.routes.test.js" ]] || { fail "admins tests missing"; return 1; }
  [[ -f "$PROJECT_ROOT/dashboard/src/pages/AdminsPage.jsx" ]] || { fail "AdminsPage missing"; return 1; }
  grep -q "requireRole" "$PROJECT_ROOT/server/src/middleware/auth.js" || { fail "requireRole not in auth.js"; return 1; }
  grep -q "role" "$PROJECT_ROOT/server/src/routes/auth.js" || { fail "role not in auth.js JWT"; return 1; }
  grep -q "admins" "$PROJECT_ROOT/server/src/index.js" || { fail "admins route not registered"; return 1; }
  grep -q "Admins" "$PROJECT_ROOT/dashboard/src/App.jsx" || { fail "Admins route not in dashboard"; return 1; }
  return 0
}
