PHASE=16
NAME="rbac"
SKILL_DOMAIN=".devin/skills/phase-16-rbac/SKILL.md"
FILES_OWNED="server/src/routes/admins.js,server/src/db/migrations/007_rbac.sql,server/src/db/migrations-sqlite/007_rbac.sql,server/tests/admins.routes.test.js,dashboard/src/pages/AdminsPage.jsx,dashboard/src/api/admins.js,server/src/middleware/auth.js,server/src/routes/setup.js,server/src/routes/auth.js,server/src/routes/devices.js,server/src/index.js,dashboard/src/App.jsx,dashboard/src/components/DashboardLayout.jsx"
