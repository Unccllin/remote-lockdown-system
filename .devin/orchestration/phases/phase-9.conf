phase_tests() {
  [[ -f "$PROJECT_ROOT/tests/e2e/agent-helpers.js" ]] || { fail "agent-helpers.js missing"; return 1; }
  [[ -f "$PROJECT_ROOT/tests/e2e/agent-integration.test.js" ]] || { fail "agent-integration.test.js missing"; return 1; }
