# Phase 12: Docker Compose Validation
PHASE=12
NAME="docker"
SKILL_DOMAIN=".devin/skills/phase-12-docker/SKILL.md"
FILES_OWNED="scripts/validate-docker.sh,docker-compose.test.yml,docs/DEPLOYMENT.md"
TASKS="create-docker-validation-script,create-test-compose,create-deployment-docs"

phase_tests() {
  [[ -x "$PROJECT_ROOT/scripts/validate-docker.sh" ]] || { fail "validate-docker.sh not executable"; return 1; }
  bash -n "$PROJECT_ROOT/scripts/validate-docker.sh" 2>&1 || { fail "validate-docker.sh syntax"; return 1; }
  [[ -f "$PROJECT_ROOT/docker-compose.test.yml" ]] || { fail "docker-compose.test.yml missing"; return 1; }
  python3 -c "import yaml; yaml.safe_load(open('$PROJECT_ROOT/docker-compose.test.yml'))" 2>&1 || { fail "test compose invalid YAML"; return 1; }
  [[ -f "$PROJECT_ROOT/docs/DEPLOYMENT.md" ]] || { fail "DEPLOYMENT.md missing"; return 1; }
  return 0
}
