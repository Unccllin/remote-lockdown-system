# Phase 0: Build Foundation & Artifact Verification
PHASE=0
NAME="build-foundation"
SKILL_DOMAIN=".devin/skills/phase-0-build-foundation/SKILL.md"
FILES_OWNED="scripts/build-all.sh,scripts/check-artifacts.sh,Makefile"
TASKS="create-build-all-script,create-artifact-checker,create-makefile"
GRAPH_NODE="P0"
VERIFY_NODES="V-SYNTAX-SWEEP V-SHELL-SYNTAX V-ENV"

phase_tests() {
  # Test: build-all.sh exists and is executable
  [[ -x "$PROJECT_ROOT/scripts/build-all.sh" ]] || { fail "build-all.sh not executable"; return 1; }

  # Test: check-artifacts.sh exists and is executable
  [[ -x "$PROJECT_ROOT/scripts/check-artifacts.sh" ]] || { fail "check-artifacts.sh not executable"; return 1; }

  # Test: Makefile exists with expected targets
  [[ -f "$PROJECT_ROOT/Makefile" ]] || { fail "Makefile missing"; return 1; }
  grep -q "build" "$PROJECT_ROOT/Makefile" || { fail "Makefile missing build target"; return 1; }
  grep -q "test" "$PROJECT_ROOT/Makefile" || { fail "Makefile missing test target"; return 1; }

  # Test: check-artifacts.sh runs without error (even if artifacts don't exist yet, script should handle gracefully)
  "$PROJECT_ROOT/scripts/check-artifacts.sh" --check-structure >/dev/null 2>&1 || true

  return 0
}
