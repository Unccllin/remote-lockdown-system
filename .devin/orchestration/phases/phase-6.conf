# Phase 6: Monitoring & Alerting
PHASE=6
NAME="monitoring"
SKILL_DOMAIN=".devin/skills/phase-6-monitoring/SKILL.md"
FILES_OWNED="server/src/routes/health.js,server/src/middleware/health.js,dashboard/src/pages/HealthPage.jsx,dashboard/src/api/health.js,scripts/monitor.sh,server/tests/health.test.js"
TASKS="create-health-endpoint,create-health-middleware,create-health-dashboard-page,create-monitor-script,create-health-tests"

phase_tests() {
  # Test: health endpoint route file exists
  [[ -f "$PROJECT_ROOT/server/src/routes/health.js" ]] || { fail "health.js route missing"; return 1; }

  # Test: health dashboard page exists
  [[ -f "$PROJECT_ROOT/dashboard/src/pages/HealthPage.jsx" ]] || { fail "HealthPage.jsx missing"; return 1; }

  # Test: monitor script exists and is executable
  [[ -x "$PROJECT_ROOT/scripts/monitor.sh" ]] || { fail "monitor.sh not executable"; return 1; }

  # Test: health tests exist and pass
  [[ -f "$PROJECT_ROOT/server/tests/health.test.js" ]] || { fail "health tests missing"; return 1; }
  (cd "$PROJECT_ROOT/server" && npm test -- --testPathPattern="health" >/dev/null 2>&1) || {
    fail "Health tests failed"
    return 1
  }

  return 0
}
