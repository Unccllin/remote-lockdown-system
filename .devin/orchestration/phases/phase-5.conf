# Phase 5: Code Signing & Auto-Update
PHASE=5
NAME="signing-autoupdate"
SKILL_DOMAIN=".devin/skills/phase-5-signing-autoupdate/SKILL.md"
FILES_OWNED="scripts/setup-signing.sh,docs/CODE_SIGNING.md,electron/package.json,scripts/verify-signing.sh"
TASKS="create-signing-setup-script,update-code-signing-docs,verify-electron-signing-config,create-signing-verification-script"

phase_tests() {
  # Test: signing setup script exists and is executable
  [[ -x "$PROJECT_ROOT/scripts/setup-signing.sh" ]] || { fail "setup-signing.sh not executable"; return 1; }

  # Test: signing verification script exists and is executable
  [[ -x "$PROJECT_ROOT/scripts/verify-signing.sh" ]] || { fail "verify-signing.sh not executable"; return 1; }

  # Test: CODE_SIGNING.md has been updated with automation section
  grep -qi "automation\|setup-signing\|azure.trusted.signing" "$PROJECT_ROOT/docs/CODE_SIGNING.md" || {
    fail "CODE_SIGNING.md missing automation section"
    return 1
  }

  # Test: electron package.json has signing config placeholders
  grep -qi "certificateFile\|cscLink\|azure.trusted" "$PROJECT_ROOT/electron/package.json" || true

  return 0
}
