# Phase 2: Platform Service Installers
PHASE=2
NAME="platform-services"
SKILL_DOMAIN=".devin/skills/phase-2-platform-services/SKILL.md"
FILES_OWNED="agent/platform/linux/lockdown-agent.service,agent/platform/linux/install.sh,agent/platform/macos/com.lockdown.agent.plist,agent/platform/macos/install.sh,agent/platform/windows/install-service-enhanced.ps1"
TASKS="create-systemd-unit,create-linux-installer,create-launchd-plist,create-macos-installer,enhance-windows-installer"
GRAPH_NODE="P2"
VERIFY_NODES="V-SHELL-SYNTAX V-SYNTAX-SWEEP"

phase_tests() {
  # Test: Linux systemd unit exists and validates
  local svc="$PROJECT_ROOT/agent/platform/linux/lockdown-agent.service"
  [[ -f "$svc" ]] || { fail "systemd unit missing"; return 1; }
  if command -v systemd-analyze >/dev/null 2>&1; then
    systemd-analyze verify "$svc" 2>&1 || { fail "systemd unit invalid"; return 1; }
  fi

  # Test: Linux installer exists and is executable
  [[ -x "$PROJECT_ROOT/agent/platform/linux/install.sh" ]] || { fail "Linux installer not executable"; return 1; }

  # Test: macOS launchd plist exists and validates
  local plist="$PROJECT_ROOT/agent/platform/macos/com.lockdown.agent.plist"
  [[ -f "$plist" ]] || { fail "launchd plist missing"; return 1; }
  # plutil only available on macOS; validate XML structure on other platforms
  if command -v plutil >/dev/null 2>&1; then
    plutil -lint "$plist" 2>&1 || { fail "plist invalid"; return 1; }
  else
    python3 -c "import xml.etree.ElementTree; xml.etree.ElementTree.parse('$plist')" 2>&1 || { fail "plist XML invalid"; return 1; }
  fi

  # Test: macOS installer exists and is executable
  [[ -x "$PROJECT_ROOT/agent/platform/macos/install.sh" ]] || { fail "macOS installer not executable"; return 1; }

  # Test: Windows enhanced installer exists
  [[ -f "$PROJECT_ROOT/agent/platform/windows/install-service-enhanced.ps1" ]] || { fail "Windows enhanced installer missing"; return 1; }

  return 0
}
