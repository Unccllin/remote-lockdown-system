# Phase 8: Dependency Installation & SAST
PHASE=8
NAME="deps-sast"
SKILL_DOMAIN=".devin/skills/phase-8-deps-sast/SKILL.md"
FILES_OWNED="server/package.json,dashboard/package.json,agent/requirements-dev.txt,.github/workflows/codeql.yml,.github/workflows/lint.yml"
TASKS="install-eslint-devdeps,install-ruff-devdep,create-codeql-workflow,fix-lint-workflow"
GRAPH_NODE="P8"
VERIFY_NODES="V-LINT-SERVER V-LINT-DASHBOARD V-LINT-AGENT"

phase_tests() {
  [[ -f "$PROJECT_ROOT/agent/requirements-dev.txt" ]] || { fail "requirements-dev.txt missing"; return 1; }
  [[ -f "$PROJECT_ROOT/.github/workflows/codeql.yml" ]] || { fail "codeql.yml missing"; return 1; }
  grep -q "eslint" "$PROJECT_ROOT/server/package.json" || { fail "eslint not in server deps"; return 1; }
  grep -q "eslint" "$PROJECT_ROOT/dashboard/package.json" || { fail "eslint not in dashboard deps"; return 1; }
  grep -q "ruff" "$PROJECT_ROOT/agent/requirements-dev.txt" || { fail "ruff not in dev deps"; return 1; }
  python3 -c "import yaml; yaml.safe_load(open('$PROJECT_ROOT/.github/workflows/codeql.yml'))" 2>&1 || { fail "codeql.yml invalid YAML"; return 1; }
  python3 -c "import yaml; yaml.safe_load(open('$PROJECT_ROOT/.github/workflows/lint.yml'))" 2>&1 || { fail "lint.yml invalid YAML"; return 1; }
  return 0
}
