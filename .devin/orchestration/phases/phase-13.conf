PHASE=13
NAME="notifications-metrics"
SKILL_DOMAIN=".devin/skills/phase-13-notifications-metrics/SKILL.md"
FILES_OWNED="server/src/routes/metrics.js,server/src/notifications/notify.js,server/src/jobs/alertScheduler.js,server/tests/notifications.test.js,server/tests/metrics.test.js,server/package.json,server/src/index.js"
TASKS="create-metrics-endpoint,create-notification-module,create-alert-scheduler,create-notification-tests,create-metrics-tests,register-routes"

phase_tests() {
  [[ -f "$PROJECT_ROOT/server/src/routes/metrics.js" ]] || { fail "metrics.js missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/src/notifications/notify.js" ]] || { fail "notify.js missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/src/jobs/alertScheduler.js" ]] || { fail "alertScheduler.js missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/tests/notifications.test.js" ]] || { fail "notifications tests missing"; return 1; }
  [[ -f "$PROJECT_ROOT/server/tests/metrics.test.js" ]] || { fail "metrics tests missing"; return 1; }
  grep -q "prom-client" "$PROJECT_ROOT/server/package.json" || { fail "prom-client not in deps"; return 1; }
  grep -q "metrics" "$PROJECT_ROOT/server/src/index.js" || { fail "metrics route not registered"; return 1; }
  return 0
}
