# Phase 10: Dashboard E2E (Playwright)
PHASE=10
NAME="dashboard-e2e"
SKILL_DOMAIN=".devin/skills/phase-10-dashboard-e2e/SKILL.md"
FILES_OWNED="dashboard/playwright.config.js,dashboard/e2e/fixtures.js,dashboard/e2e/auth.spec.js,dashboard/e2e/devices.spec.js,dashboard/package.json"
TASKS="install-playwright,create-playwright-config,create-e2e-fixtures,create-auth-tests,create-device-tests"
GRAPH_NODE="P10"
VERIFY_NODES="V-DASHBOARD"

phase_tests() {
  [[ -f "$PROJECT_ROOT/dashboard/playwright.config.js" ]] || { fail "playwright.config.js missing"; return 1; }
  [[ -d "$PROJECT_ROOT/dashboard/e2e" ]] || { fail "e2e dir missing"; return 1; }
  [[ -f "$PROJECT_ROOT/dashboard/e2e/fixtures.js" ]] || { fail "fixtures.js missing"; return 1; }
  [[ -f "$PROJECT_ROOT/dashboard/e2e/auth.spec.js" ]] || { fail "auth.spec.js missing"; return 1; }
  [[ -f "$PROJECT_ROOT/dashboard/e2e/devices.spec.js" ]] || { fail "devices.spec.js missing"; return 1; }
  grep -q "playwright" "$PROJECT_ROOT/dashboard/package.json" || { fail "playwright not in package.json"; return 1; }
  node -c "$PROJECT_ROOT/dashboard/playwright.config.js" 2>&1 || { fail "playwright config syntax"; return 1; }
  return 0
}
