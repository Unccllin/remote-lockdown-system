# Phase 14: Backup & Restore
PHASE=14
NAME="backup-restore"
SKILL_DOMAIN=".devin/skills/phase-14-backup-restore/SKILL.md"
FILES_OWNED="scripts/backup.sh,scripts/restore.sh,docs/BACKUP.md"
TASKS="create-backup-script,create-restore-script,create-backup-docs"

phase_tests() {
  [[ -x "$PROJECT_ROOT/scripts/backup.sh" ]] || { fail "backup.sh not executable"; return 1; }
  bash -n "$PROJECT_ROOT/scripts/backup.sh" 2>&1 || { fail "backup.sh syntax"; return 1; }
  [[ -x "$PROJECT_ROOT/scripts/restore.sh" ]] || { fail "restore.sh not executable"; return 1; }
  bash -n "$PROJECT_ROOT/scripts/restore.sh" 2>&1 || { fail "restore.sh syntax"; return 1; }
  [[ -f "$PROJECT_ROOT/docs/BACKUP.md" ]] || { fail "BACKUP.md missing"; return 1; }
  return 0
}
