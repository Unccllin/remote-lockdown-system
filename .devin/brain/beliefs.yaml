- id: B-070
  statement: 'A served installer script must carry no secret: MeshCentral-style URLs embed a device id,
    but a single-use 15-minute enrollment token in a URL would be written to this server''s request log
    (query strings are logged), shell history and browser history. GET /api/enroll/setup.ps1 is therefore
    public and token-free — it prompts with Read-Host — and delegates (reachability check, download the
    wizard, then --silent when INSTALLER_SILENT=true or the GUI with the URL on the clipboard) rather
    than re-implementing enrolment, config writing or service registration. The dashboard shows the one-liner
    (powershell -NoProfile -ExecutionPolicy Bypass -Command "irm ''<server>/api/enroll/setup.ps1'' | iex")
