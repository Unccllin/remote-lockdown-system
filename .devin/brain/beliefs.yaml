  evidence_level: emulated
  provenance: 'firmware/PblPkg/test-mor-harness.sh QEMU+OVMF run 2026-09-18: serial ''[MOR] SetVariable
    failed: Write Protected'' + NVRAM varstore scan (spec-GUID var live data=00, no global-GUID decoy,
    lock var absent); mechanism confirmed in edk2 TcgMorLockDxe.c:74-98,124-147'
