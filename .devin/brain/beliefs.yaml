- id: B-026
  statement: 'Non-SMM EDK2 variable drivers (VariableRuntimeDxe, incl. the custom OVMF and Ubuntu OVMF
    builds) treat MOR as unsupported: MorLockInit deletes both MOR vars and MorLockInitAtEndOfDxe registers
    unconditional LOCK_NOW VariablePolicies — no BDS-phase or OS writer can set MOR on such platforms.
    A DXE-phase writer before EndOfDxe would beat the policy lock (relevant to DXE-tier enforcement-depth
    decision).'
  domain: firmware/mor
  status: confirmed
  evidence_level: spec-checked
  provenance: 'edk2 MdeModulePkg/Universal/Variable/RuntimeDxe/TcgMorLockDxe.c:64-100 (unconditional delete)
    + :109-152 (unconditional LOCK_NOW on both vars at EndOfDxe); SMM variant TcgMorLockSmm.c:433-574
    (conditional on var legitimacy); emulated corroboration: WRITE_PROTECTED on both OVMF configs'
  source: NG-T4 outcome verification
