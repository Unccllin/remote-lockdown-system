  statement: 'PBL''s MOR request targets the correct spec-GUID variable and is evaluated by the platform''s
    policy engine (WRITE_PROTECTED denial proves it reached the real variable, not a decoy), but functional
    memory-clear is platform-gated: non-SMM EDK2 variable drivers register LOCK_NOW VariablePolicies on
    both MOR vars at EndOfDxe, so no post-EndOfDxe writer can set MOR. Functional MOR requires SMM-capable
    firmware with legitimate MOR provisioning — hardware-gated.'
  domain: firmware/mor
