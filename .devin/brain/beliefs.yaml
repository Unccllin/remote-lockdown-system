- id: B-057
  statement: 'The TLS 1.2 floor for the verdict fetch is enforced at the terminator, not by the device:
    Caddy states ''tls { protocols tls1.2 tls1.3 }'' (validated by the real caddy binary) and Cloudflare''s
    zone Minimum TLS Version must be 1.2 (a dashboard step, documented in serverless/README.md). The device
    structurally cannot raise it — PBL holds only EFI_HTTP_PROTOCOL, HttpDxe exposes no EfiTlsVersion,
    and EDK2''s TlsDxe creates its context as TLS10 (TlsDriver.c:263) which TlsInit.c:107 applies as the
    SSL_CTX minimum with only SSLv3 disabled. scripts/test_tls_floor.py proves the floor behaviourally
    AND must force the offer with ''-cipher DEFAULT@SECLEVEL=0'' because OpenSSL 3 refuses to offer TLS
    1.0 at its default security level: without that, the test passes with the server never consulted.
    Also: docs/adr/PBL-DEBT-LEDGER.md (markdown) and .devin/graph/GRAPH-SPEC.yaml disagreed about D-116
    and D-117 status — the spec is authoritative for graph invariants and the markdown had drifted, which
    graph_assert cannot detect.'
